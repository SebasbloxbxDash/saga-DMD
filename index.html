<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DMD | GESTIÓN DE IDENTIDAD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');
        :root { --color-principal: #ff0000; --color-fondo: #050000; }
        body { background-color: var(--color-fondo); color: #b30000; font-family: 'Special Elite', monospace; margin: 0; overflow-x: hidden; user-select: none; }

        /* --- INTERFAZ DE ACCESO --- */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { border: 1px solid var(--color-principal); padding: 30px; background: rgba(20, 0, 0, 0.9); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 50px #4a0000; }
        
        input { display: block; width: 100%; background: #000; border: 1px solid #4a0000; color: var(--color-principal); padding: 12px; margin-bottom: 10px; font-family: 'Special Elite'; box-sizing: border-box; outline: none; }
        input:focus { border-color: white; }
        
        button { background: var(--color-principal); color: #000; border: none; padding: 12px; font-family: 'Special Elite'; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: white; }

        .link-group { margin-top: 15px; font-size: 0.7rem; }
        .toggle-link { color: #600; cursor: pointer; text-decoration: underline; margin: 0 5px; }

        /* --- CONTENIDO --- */
        #main-content { display: none; opacity: 0; transition: 2s; padding: 20px; }
        .warning-label { background: var(--color-principal); color: #000; padding: 5px 20px; font-weight: bold; display: inline-block; }

        /* --- ALERTA --- */
        #hacker-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: red; color: black; z-index: 99999; text-align: center; padding-top: 20%; font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="hacker-alert">⚠️ ACCESO NO AUTORIZADO DETECTADO ⚠️</div>

<div id="auth-overlay">
    <div class="auth-box" id="auth-box">
        <div class="warning-label" style="margin-bottom:20px">TERMINAL DE ACCESO</div>
        <h2 id="auth-title">INICIAR SESIÓN</h2>
        
        <div id="inputs-container">
            <input type="text" id="user-input" placeholder="USUARIO / AGENTE">
            <input type="password" id="pass-input" placeholder="CONTRASEÑA">
            <input type="email" id="email-input" placeholder="CORREO@DMD.GOV" style="display:none;">
        </div>

        <button onclick="procesarAuth()" id="btn-main">ACCEDER</button>
        
        <p id="auth-msg" style="color:red; display:none; font-size:0.7rem; margin-top:10px"></p>

        <div class="link-group">
            <span class="toggle-link" onclick="cambiarModo('login')">Login</span> |
            <span class="toggle-link" onclick="cambiarModo('registro')">Registrar</span> |
            <span class="toggle-link" onclick="cambiarModo('reset')">Recuperar Clave</span>
        </div>
    </div>
</div>

<div id="main-content">
    <header style="text-align:center; border:2px double #4a0000; padding:20px; margin-bottom:30px;">
        <div class="warning-label">SISTEMA DMD 2026</div>
        <h1>REGISTRO MAESTRO RESTAURADO</h1>
        <p>AGENTE ACTIVO: <span id="user-session" style="color:white;"></span></p>
        <button onclick="location.reload()" style="width:auto; padding:5px 15px; font-size:0.6rem;">CERRAR SESIÓN</button>
    </header>
    
    <div style="max-width:900px; margin:auto;">
        <p>Acceso verificado. Todos los módulos de la saga DMD están disponibles.</p>
        </div>
</div>

<script>
/* --- BASE DE DATOS LOCAL (SIMULADA) --- */
let usuarios = {
    "stilexlplus": { pass: "Departamento mental demoníaco", email: "admin@dmd.com", verificado: true },
    "sebasbloxbx": { pass: "Departamento mental demoníaco", email: "dev@dmd.com", verificado: true },
    "usuario10": { pass: "Departamento mental demoníaco", email: "agente10@dmd.com", verificado: true }
};

let modoActual = 'login';

function cambiarModo(modo) {
    modoActual = modo;
    const t = document.getElementById('auth-title');
    const b = document.getElementById('btn-main');
    const e = document.getElementById('email-input');
    const p = document.getElementById('pass-input');
    const u = document.getElementById('user-input');
    
    document.getElementById('auth-msg').style.display = 'none';

    if(modo === 'login') {
        t.innerText = "INICIAR SESIÓN";
        b.innerText = "ACCEDER";
        e.style.display = "none";
        p.style.display = "block";
    } else if(modo === 'registro') {
        t.innerText = "NUEVO REGISTRO";
        b.innerText = "CREAR CUENTA Y VINCULAR";
        e.style.display = "block";
        p.style.display = "block";
    } else if(modo === 'reset') {
        t.innerText = "RECUPERAR ACCESO";
        b.innerText = "VERIFICAR Y CAMBIAR";
        e.style.display = "block";
        p.placeholder = "NUEVA CONTRASEÑA";
        p.style.display = "block";
    }
}

function procesarAuth() {
    const u = document.getElementById('user-input').value.toLowerCase();
    const p = document.getElementById('pass-input').value;
    const m = document.getElementById('email-input').value;
    const msg = document.getElementById('auth-msg');

    if(modoActual === 'login') {
        if(usuarios[u] && usuarios[u].pass === p) {
            iniciar(u);
        } else {
            mostrarError("ERROR: CREDENCIALES INVÁLIDAS");
        }
    } 
    else if(modoActual === 'registro') {
        if(u && p && m.includes('@')) {
            usuarios[u] = { pass: p, email: m, verificado: false };
            const cod = Math.floor(1000 + Math.random() * 9000);
            alert("CÓDIGO DE VERIFICACIÓN ENVIADO A: " + m + "\nCÓDIGO: " + cod);
            let check = prompt("INGRESE EL CÓDIGO DE 4 DÍGITOS:");
            if(check == cod) {
                usuarios[u].verificado = true;
                alert("CORREO VERIFICADO. CUENTA VINCULADA.");
                cambiarModo('login');
            } else {
                mostrarError("CÓDIGO INCORRECTO. REGISTRO FALLIDO.");
            }
        } else {
            mostrarError("COMPLETE TODOS LOS CAMPOS");
        }
    }
    else if(modoActual === 'reset') {
        if(usuarios[u] && usuarios[u].email === m) {
            const cod = Math.floor(1000 + Math.random() * 9000);
            alert("PROTOCOLO DE RECUPERACIÓN PARA: " + u + "\nCÓDIGO: " + cod);
            let check = prompt("CONFIRME EL CÓDIGO PARA CAMBIAR CLAVE:");
            if(check == cod) {
                usuarios[u].pass = p;
                alert("CONTRASEÑA ACTUALIZADA CON ÉXITO.");
                cambiarModo('login');
            } else {
                mostrarError("ERROR DE VERIFICACIÓN.");
            }
        } else {
            mostrarError("EL USUARIO Y CORREO NO COINCIDEN.");
        }
    }
}

function mostrarError(txt) {
    const msg = document.getElementById('auth-msg');
    msg.innerText = txt;
    msg.style.display = 'block';
}

function iniciar(u) {
    document.getElementById('user-session').innerText = u;
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 50);
}

/* ANTI-HACKER */
document.onkeydown = function(e) {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) {
        document.getElementById('hacker-alert').style.display = 'block';
        setTimeout(() => { location.reload(); }, 2000);
        return false;
    }
};
</script>
</body>
</html>
