<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMD Archive | Móvil</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #161616;
            --red: #a30000;
            --gray: #888;
        }

        body {
            background-color: var(--bg);
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 30px 15px;
            text-align: center;
            border-bottom: 3px solid var(--red);
            background: #000;
        }

        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        .subtitle { color: var(--red); font-size: 0.9rem; font-weight: bold; }

        .container { padding: 15px; }

        h2 { 
            font-size: 1.2rem; 
            border-left: 4px solid var(--red); 
            padding-left: 10px; 
            margin-top: 30px;
        }

        /* Tabla con scroll para móvil */
        .table-wrapper {
            overflow-x: auto;
            background: var(--panel);
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* Evita que se amontone en móvil */
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 0.85rem;
        }

        th { background: var(--red); text-transform: uppercase; }

        .card {
            background: var(--panel);
            margin-bottom: 15px;
            padding: 15px;
            border-left: 4px solid var(--red);
        }

        .status-ok { color: #00ff00; font-weight: bold; }
        .status-wait { color: #ffcc00; font-weight: bold; }

        .warning {
            border: 1px solid var(--red);
            padding: 15px;
            background: rgba(163, 0, 0, 0.1);
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.7rem;
            color: var(--gray);
        }
    </style>
</head>
